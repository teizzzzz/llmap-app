<!DOCTYPE html>
<html>
<head>
  <!-- LLMap Web 試用版。base href は flutter build の --base-href で置き換わる。 -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="LLMap — 街なかの文字を記録するアプリの Web 試用版">
  <meta name="theme-color" content="#f4f4f4">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LLMap">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>LLMap</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #f4f4f4; }
    #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      font: 14px/1.6 -apple-system, "Hiragino Sans", "Microsoft YaHei", sans-serif; color: #6b6b6b; transition: opacity .3s; }
    #boot img { width: 72px; height: 72px; border-radius: 18px; }
    #boot .bar { width: 120px; height: 3px; border-radius: 2px; background: #e8e8e8; overflow: hidden; }
    #boot .bar i { display: block; width: 40%; height: 100%; background: #0f0f0e; border-radius: 2px; animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  </style>
</head>
<body>
  <!-- 最初の読み込み（数 MB）の間に出す。Flutter の最初の描画で消える。 -->
  <div id="boot"><img src="icons/Icon-192.png" alt=""><div class="bar"><i></i></div><div>LLMap</div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var b = document.getElementById('boot');
      if (b) { b.style.opacity = '0'; setTimeout(function () { b.remove(); }, 350); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# ビルド高速化（Step 13）: daemon / parallel は低リスクの定番設定。
org.gradle.daemon=true
org.gradle.parallel=true
android.useAndroidX=true
# プロジェクトパスに非ASCII文字(近期着手)があるためチェックを無効化
android.overridePathCheck=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin 増分コンパイルのキャッシュ close 失敗(Windows ファイルロック)を回避
kotlin.incremental=false
# Step 13: build cache を再有効化。上記 Windows 問題の原因は Kotlin 増分側で、
# Gradle build cache 自体は無関係のため戻す。Windows で再発したら false に。
org.gradle.caching=true

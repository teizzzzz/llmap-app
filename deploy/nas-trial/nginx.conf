server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # WebAssembly（CanvasKit）を正しい種類で返す
  types { application/wasm wasm; }
  include /etc/nginx/mime.types;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;

  # アプリ本体は更新が届くよう毎回確認、写真と見本データは長くキャッシュ
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /flutter_bootstrap.js { add_header Cache-Control "no-cache"; }
  location = /flutter_service_worker.js { add_header Cache-Control "no-cache"; }
  location /explore-data/thumbs/ { add_header Cache-Control "public, max-age=2592000"; }
  location /explore-data/data/ { add_header Cache-Control "no-cache"; }

  location / { try_files $uri $uri/ /index.html; }
}
